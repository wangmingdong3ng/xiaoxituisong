name: 飞书每周机审质检值班提醒

on:
  # 每周二 北京时间 9:30 = UTC 01:30
  schedule:
    - cron: '30 1 * * 2'

  # 支持手动触发（用于测试）
  workflow_dispatch:

jobs:
  send-reminder:
    runs-on: ubuntu-latest

    steps:
      - name: 检查时间
        run: |
          echo "📅 当前时间信息："
          echo "UTC 时间: $(date -u)"
          echo "北京时间: $(TZ='Asia/Shanghai' date)"
          echo "星期几: $(date +%u)"

      - name: 获取飞书 Token
        id: get_token
        run: |
          echo "🔑 获取飞书访问令牌..."

          APP_ID="${{ secrets.FEISHU_APP_ID }}"
          APP_SECRET="${{ secrets.FEISHU_APP_SECRET }}"

          if [ -z "$APP_ID" ] || [ -z "$APP_SECRET" ]; then
            echo "❌ 缺少 FEISHU_APP_ID 或 FEISHU_APP_SECRET"
            echo "请在仓库 Settings → Secrets and variables → Actions 中添加"
            exit 1
          fi

          RESPONSE=$(curl -s -X POST https://open.feishu.cn/open-apis/auth/v3/tenant_access_token/internal \
            -H "Content-Type: application/json" \
            -d "{\"app_id\":\"$APP_ID\",\"app_secret\":\"$APP_SECRET\"}")

          TOKEN=$(echo "$RESPONSE" | jq -r '.tenant_access_token')
          CODE=$(echo "$RESPONSE" | jq -r '.code')

          if [ "$CODE" != "0" ] || [ -z "$TOKEN" ] || [ "$TOKEN" = "null" ]; then
            echo "❌ 获取 token 失败"
            echo "错误码: $CODE"
            echo "错误信息: $(echo "$RESPONSE" | jq -r '.msg')"
            exit 1
          fi

          echo "✅ Token 获取成功"
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"

      - name: 批量查询风险域负责人 open_id
        id: get_openids
        run: |
          set -euo pipefail

          TOKEN="${{ steps.get_token.outputs.token }}"

          echo "👥 批量查询风险域负责人 open_id..."

          EMAILS_JSON='[
            "luowanmin.426@jiyunhudong.com",
            "fupeiwen@jiyunhudong.com",
            "gaoyan.0327@jiyunhudong.com",
            "cuihongxu@jiyunhudong.com",
            "jiguosheng.666@jiyunhudong.com",
            "wenkebing@jiyunhudong.com",
            "liushuwan.0821@jiyunhudong.com",
            "zhanghuijun.01@jiyunhudong.com"
          ]'

          RESPONSE=$(curl -s -X POST "https://open.feishu.cn/open-apis/contact/v3/users/batch_get_id?user_id_type=open_id" \
            -H "Authorization: Bearer $TOKEN" \
            -H "Content-Type: application/json; charset=utf-8" \
            -d "{\"emails\":$EMAILS_JSON}")

          CODE=$(echo "$RESPONSE" | jq -r '.code')
          if [ "$CODE" != "0" ]; then
            echo "❌ 批量查询 open_id 失败"
            echo "错误码: $CODE"
            echo "错误信息: $(echo "$RESPONSE" | jq -r '.msg')"
            echo "完整响应: $RESPONSE"
            exit 1
          fi

          extract_open_id() {
            local email="$1"
            echo "$RESPONSE" | jq -r --arg email "$email" '
              .data.user_list[]
              | select(.email == $email)
              | (.open_id // .user_id // empty)
            ' | head -n 1
          }

          PAN_ENT_OPEN_ID=$(extract_open_id "luowanmin.426@jiyunhudong.com")
          PORN_OPEN_ID=$(extract_open_id "fupeiwen@jiyunhudong.com")
          SPECIAL_GROUP_OPEN_ID=$(extract_open_id "gaoyan.0327@jiyunhudong.com")
          ORDER_OPEN_ID=$(extract_open_id "cuihongxu@jiyunhudong.com")
          POLITICS_OPEN_ID=$(extract_open_id "jiguosheng.666@jiyunhudong.com")
          GAME_OPEN_ID=$(extract_open_id "wenkebing@jiyunhudong.com")
          DIALECT_OPEN_ID=$(extract_open_id "liushuwan.0821@jiyunhudong.com")
          REPORT_OPEN_ID=$(extract_open_id "zhanghuijun.01@jiyunhudong.com")

          for pair in \
            "泛娱乐不良:$PAN_ENT_OPEN_ID" \
            "色情性化:$PORN_OPEN_ID" \
            "录播特殊群体:$SPECIAL_GROUP_OPEN_ID" \
            "专业限制平台秩序:$ORDER_OPEN_ID" \
            "违法危险行为涉政:$POLITICS_OPEN_ID" \
            "游戏:$GAME_OPEN_ID" \
            "方言外语:$DIALECT_OPEN_ID" \
            "举报:$REPORT_OPEN_ID"; do
            label="${pair%%:*}"
            open_id="${pair#*:}"
            if [ -z "$open_id" ]; then
              echo "❌ 未查到【$label】对应的 open_id"
              echo "完整响应: $RESPONSE"
              exit 1
            fi
          done

          MENTION_LINE="泛娱乐不良 <at id=\"$PAN_ENT_OPEN_ID\"></at>、色情性化 <at id=\"$PORN_OPEN_ID\"></at>、录播特殊群体 <at id=\"$SPECIAL_GROUP_OPEN_ID\"></at>、专业限制平台秩序 <at id=\"$ORDER_OPEN_ID\"></at>、违法危险行为涉政 <at id=\"$POLITICS_OPEN_ID\"></at>、游戏 <at id=\"$GAME_OPEN_ID\"></at>、方言外语 <at id=\"$DIALECT_OPEN_ID\"></at>、举报 <at id=\"$REPORT_OPEN_ID\"></at>"

          {
            echo "PAN_ENT_OPEN_ID=$PAN_ENT_OPEN_ID"
            echo "PORN_OPEN_ID=$PORN_OPEN_ID"
            echo "SPECIAL_GROUP_OPEN_ID=$SPECIAL_GROUP_OPEN_ID"
            echo "ORDER_OPEN_ID=$ORDER_OPEN_ID"
            echo "POLITICS_OPEN_ID=$POLITICS_OPEN_ID"
            echo "GAME_OPEN_ID=$GAME_OPEN_ID"
            echo "DIALECT_OPEN_ID=$DIALECT_OPEN_ID"
            echo "REPORT_OPEN_ID=$REPORT_OPEN_ID"
            echo "MENTION_LINE=$MENTION_LINE"
          } >> "$GITHUB_ENV"

          {
            echo "pan_ent_open_id=$PAN_ENT_OPEN_ID"
            echo "porn_open_id=$PORN_OPEN_ID"
            echo "special_group_open_id=$SPECIAL_GROUP_OPEN_ID"
            echo "order_open_id=$ORDER_OPEN_ID"
            echo "politics_open_id=$POLITICS_OPEN_ID"
            echo "game_open_id=$GAME_OPEN_ID"
            echo "dialect_open_id=$DIALECT_OPEN_ID"
            echo "report_open_id=$REPORT_OPEN_ID"
          } >> "$GITHUB_OUTPUT"

          echo "✅ 风险域负责人 open_id 查询成功"

      - name: 发送机审质检值班提醒卡片
        id: send_card
        run: |
          set -euo pipefail

          TOKEN="${{ steps.get_token.outputs.token }}"
          CHAT_ID="oc_60b5e9c78c4a10f6a85777fe4900767f"

          echo "🚀 发送机审质检值班提醒到群聊[机审质检值班群]..."

          CARD_JSON=$(jq -n --arg mention_line "$MENTION_LINE" '{
            config: {
              wide_screen_mode: true
            },
            elements: [
              {
                tag: "div",
                text: {
                  tag: "lark_md",
                  content: "**本周机审质检值班提醒**"
                }
              },
              {
                tag: "hr"
              },
              {
                tag: "div",
                text: {
                  tag: "lark_md",
                  content: "🗒 **提醒内容：**\n本周机审质检值班提醒，请各风险域配合完成以下事项："
                }
              },
              {
                tag: "div",
                text: {
                  tag: "lark_md",
                  content: "**1️⃣ 队列信息更新**\n请各业务同学更新所负责队列信息（前5个sheet，涉及队列上下线、试审等），并在sheet6[周度队列信息汇总]进行汇总：\n[模型标注队列信息汇总](https://bytedance.larkoffice.com/sheets/ZnCssbBlMhreNPt1URecMeLenih?sheet=8Lckiq&dcuId=skip_auth&disposable_login_%3D.e0bebb06f07201a8e4722e5545f76764d3701c0c11b1e6d49bcdab5fd6baf154)\n\n\($mention_line)"
                }
              },
              {
                tag: "hr"
              },
              {
                tag: "div",
                text: {
                  tag: "lark_md",
                  content: "**2️⃣ 模型分析记录留痕**\n请大家及时在文档中完成本周机审模型分析记录的留痕，保证分析过程可追溯：\n[26年机审模型分析记录](https://bytedance.larkoffice.com/wiki/O0H9wyXl5imLdjkc0ibcrASUn9f?sheet=L0nqmc&dcuId=skip_auth&disposable_login_%3D.ba7688fb1098a2ba6a1e7988d6fb7629b355d77237626e0452a98cd7e2b21ed9)"
                }
              },
              {
                tag: "hr"
              },
              {
                tag: "div",
                text: {
                  tag: "lark_md",
                  content: "⏰ 以上事项请于今日 **18:00** 前完成，感谢大家配合！🙏"
                }
              }
            ]
          }')

          SEND_RESPONSE=$(curl -s -X POST \
            "https://open.feishu.cn/open-apis/im/v1/messages?receive_id_type=chat_id" \
            -H "Authorization: Bearer $TOKEN" \
            -H "Content-Type: application/json" \
            -d "$(jq -n --arg receive_id "$CHAT_ID" --arg content "$CARD_JSON" '{receive_id: $receive_id, msg_type: "interactive", content: $content}')")

          echo "发送响应: $SEND_RESPONSE"

          SEND_CODE=$(echo "$SEND_RESPONSE" | jq -r '.code')

          if [ "$SEND_CODE" = "0" ]; then
            MSG_ID=$(echo "$SEND_RESPONSE" | jq -r '.data.message_id')
            echo "✅ 卡片发送成功！消息ID: $MSG_ID"
          else
            echo "❌ 发送失败"
            echo "错误码: $SEND_CODE"
            echo "错误信息: $(echo "$SEND_RESPONSE" | jq -r '.msg')"
            exit 1
          fi

      - name: 执行完成
        if: always()
        run: |
          echo "================================"
          echo "✅ 每周一机审质检值班提醒 - 执行完成"
          echo "================================"
